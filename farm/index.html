<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm</title>
  </head>
  <body>
    <div id="stage"></div>

    <section id="home" class="screen card">
      <h1>Farm</h1>
      <p class="muted">1v1 farming race. Buy land, grow crops, outsell your neighbour.</p>
      <input id="name" maxlength="16" autocomplete="off" placeholder="Your name" />
      <button id="create" class="primary">Create room</button>
      <div class="join-row">
        <input id="code" maxlength="4" autocomplete="off" placeholder="CODE" />
        <button id="join">Join</button>
      </div>
      <p id="home-error" class="error"></p>
    </section>

    <section id="lobby" class="screen card hidden">
      <p class="muted">Room code</p>
      <div id="lobby-code" class="room-code"></div>
      <p id="lobby-players-title" class="list-title"></p>
      <ul id="lobby-players" class="player-list"></ul>
      <div id="lobby-spectators-box" class="hidden">
        <p class="list-title">Spectators</p>
        <ul id="lobby-spectators" class="player-list"></ul>
      </div>
      <button id="start" class="primary hidden">Start match</button>
      <p id="lobby-wait" class="muted"></p>
    </section>

    <div id="hud" class="hidden">
      <div class="top">
        <div class="farmer" data-who="me"><span class="farmer-name"></span><button class="tech-badge" title="Tech tree"></button><span class="farmer-worth"></span></div>
        <div class="clock"><div id="match-time"></div><div id="spectating" class="muted hidden">Spectating</div></div>
        <div class="farmer" data-who="them"><span class="farmer-name"></span><button class="tech-badge" title="Tech tree"></button><span class="farmer-worth"></span></div>
      </div>

      <aside id="panel">
        <section id="versus-box" class="hidden">
          <h2>Head to head</h2>
          <table id="versus" class="versus"></table>
        </section>
        <div class="coins-row">
          <div id="coins" class="coins"></div>
          <div id="barn-size" class="muted"></div>
        </div>
        <section>
          <h2>Market</h2>
          <div id="market"></div>
        </section>
        <section>
          <h2>Orders</h2>
          <div id="contracts"></div>
        </section>
        <section>
          <h2>Research</h2>
          <button id="tech-open" class="tech-open"></button>
        </section>
        <section id="sabotage-box">
          <h2>Sabotage</h2>
          <div id="sabotage"></div>
        </section>
        <button id="concede" class="concede">Give up</button>
      </aside>

      <div id="tools" class="tools"></div>
      <div id="hint" class="hint"></div>
      <div id="tech" class="tech card hidden">
        <div class="tech-head">
          <h1 id="tech-title">Tech tree</h1>
          <div id="tech-tabs" class="tech-tabs"></div>
          <button id="tech-close" class="tech-close" title="Close (Esc)">✕</button>
        </div>
        <div id="tech-tree" class="tech-tree"></div>
        <p id="tech-note" class="muted"></p>
      </div>
      <ol id="feed" class="feed hidden"></ol>
      <div id="toast" class="toast hidden"></div>
      <div id="tip" class="tip hidden"></div>
      <div id="result" class="result card hidden"></div>
      <button id="mute" class="mute" title="Sound (M)"></button>
    </div>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
