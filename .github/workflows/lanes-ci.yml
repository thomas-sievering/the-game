name: Lanes CI

on:
  pull_request:
    paths: [lanes/**, .github/workflows/lanes-*.yml]
  push:
    branches: [master]
    paths: [lanes/**, .github/workflows/lanes-*.yml]

permissions:
  contents: read

# A new push to a PR replaces its older run.
concurrency:
  group: lanes-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lanes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lanes/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The browser tests are slow, so they run on PRs only; master is checked again after deploy.
      - name: End-to-end test against a local server
        if: github.event_name == 'pull_request'
        run: |
          npx playwright install --with-deps chromium
          PORT=2568 node dist/server.js &
          npx wait-on -t 30000 http://localhost:2568/health
          npm run e2e
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'pull_request'
        with:
          name: lanes-e2e-screenshots
          path: lanes/artifacts/e2e
          if-no-files-found: ignore
