name: Racer Deploy

on:
  workflow_run:
    workflows: [Racer CI]
    branches: [master]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: racer-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: racer
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: racer/package-lock.json

      # The browser installs while the release builds and uploads; the e2e step waits for it.
      - name: Start installing the e2e browser
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")
          (npx --yes playwright@"$version" install --with-deps chromium > "$RUNNER_TEMP/browser.log" 2>&1; echo $? > "$RUNNER_TEMP/browser.status") &

      - name: Build release
        run: bash scripts/package-release.sh "$RUNNER_TEMP/racer.tar.gz"

      - name: Configure SSH
        env:
          NEXUS_SSH_KEY: ${{ secrets.NEXUS_SSH_KEY }}
          NEXUS_KNOWN_HOSTS: ${{ secrets.NEXUS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$NEXUS_SSH_KEY" > ~/.ssh/nexus_deploy
          chmod 0600 ~/.ssh/nexus_deploy
          printf '%s\n' "$NEXUS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts

      - name: Upload and activate release
        env:
          RELEASE_ID: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          common=(-i ~/.ssh/nexus_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${common[@]}" "$RUNNER_TEMP/racer.tar.gz" deploy@nexus.siever.ing:/tmp/racer.tar.gz
          ssh "${common[@]}" deploy@nexus.siever.ing "trap 'rm -f /tmp/racer.tar.gz' EXIT; sudo /etc/nexus/nexus-deploy racer /tmp/racer.tar.gz '$RELEASE_ID'"

      - name: Public smoke check
        run: curl -fsS --max-time 10 https://racer.nexus.siever.ing/health

      - name: End-to-end test against production
        run: |
          npm ci
          timeout 300 sh -c 'until [ -f "$RUNNER_TEMP/browser.status" ]; do sleep 1; done'
          cat "$RUNNER_TEMP/browser.log"
          [ "$(cat "$RUNNER_TEMP/browser.status")" = 0 ]
          BASE_URL=https://racer.nexus.siever.ing npm run e2e -- -g "two drivers"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-e2e-screenshots
          path: |
            racer/artifacts/e2e
            racer/test-results
          if-no-files-found: ignore
