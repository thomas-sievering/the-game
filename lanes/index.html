<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lanes</title>
  </head>
  <body>
    <div id="stage"></div>

    <section id="home" class="screen card">
      <h1>Lanes</h1>
      <p class="muted">1v1 deckbuilding auto battler.</p>
      <input id="name" maxlength="16" autocomplete="off" placeholder="Your name" />
      <button id="create" class="primary">Create room</button>
      <div class="join-row">
        <input id="code" maxlength="4" autocomplete="off" placeholder="CODE" />
        <button id="join">Join</button>
      </div>
      <p id="home-error" class="error"></p>
    </section>

    <section id="lobby" class="screen card hidden">
      <p class="muted">Room code</p>
      <div id="lobby-code" class="room-code"></div>
      <p id="lobby-players-title" class="list-title"></p>
      <ul id="lobby-players" class="player-list"></ul>
      <div id="lobby-spectators-box" class="hidden">
        <p class="list-title">Spectators</p>
        <ul id="lobby-spectators" class="player-list"></ul>
      </div>
      <button id="start" class="primary hidden">Start match</button>
      <p id="lobby-wait" class="muted"></p>
    </section>

    <div id="hud" class="hidden">
      <div class="top">
        <div class="base" data-who="me"><span class="base-name"></span><div class="bar"><div class="fill"></div></div><span class="base-hp"></span></div>
        <div class="clock"><div id="match-time"></div><div id="wave-time" class="muted"></div><div id="spectating" class="muted hidden">Spectating</div></div>
        <div class="base" data-who="them"><span class="base-name"></span><div class="bar"><div class="fill"></div></div><span class="base-hp"></span></div>
      </div>
      <div class="bottom">
        <div class="economy">
          <div id="gold" class="gold"></div>
          <div id="income" class="muted"></div>
          <button id="invest" title="Shortcut: I"></button>
        </div>
        <div id="hand" class="hand"></div>
      </div>
      <div id="hint" class="hint"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="result" class="result card hidden"></div>
    </div>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
